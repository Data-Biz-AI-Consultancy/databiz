services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: databiz-frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - ollama
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: databiz-backend
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/databiz
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    container_name: databiz-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=databiz
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    container_name: databiz-ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
  postgres_data:
